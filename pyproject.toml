[project]
name = "browser-toolkit"
version = "0.1.0"
description = "Auditing, testing, and fixing toolkit for UserStyles and UserScripts using Zen Browser profile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
]

[project.scripts]
browser-toolkit = "browser_toolkit.cli:main"
browser-auditor = "browser_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
